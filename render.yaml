services:
  - type: web
    name: denesens-solutions
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
